<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collectif Noukat — Dossier de candidature</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ======================================================
       EN-TÊTE
       MODIFIE ICI : le nom de votre collectif / projet et
       la phrase d'intro (ex : nom de l'école visée).
       ====================================================== -->
  <header class="site-header">
    <p class="brand">Collectif <span>Noukat</span></p>
    <p class="tagline">
      Dossier de candidature — Animation 2D.
    </p>
  </header>

  <!-- ======================================================
       GRILLE DES 4 MEMBRES
       MODIFIE ICI pour chaque carte :
       - le chemin de l'image (images/team/...)
       - le nom
       - le rôle / spécialité
       - le lien vers la page de profil (href)
       ====================================================== -->
  <main>
    <div class="team-grid">

      <a class="team-card" href="equipe-1.html">
        <img src="/images/my-illustration/illustration_1_generation.webp" alt="Illustration de Fritzner Richard">
        <div class="caption">
          <p class="name">Fritzner Richard</p>
          <p class="role">Illustration &amp; Animation 2D</p>
        </div>
      </a>

      <a class="team-card" href="equipe-2.html">
        <img src="images/team/membre-2.jpg" alt="Portrait du membre 2">
        <div class="caption">
          <p class="name">Prénom Nom</p>
          <p class="role">Storyboard &amp; mise en scène</p>
        </div>
      </a>

      <a class="team-card" href="equipe-3.html">
        <img src="images/team/membre-3.jpg" alt="Portrait du membre 3">
        <div class="caption">
          <p class="name">Prénom Nom</p>
          <p class="role">Animation 2D</p>
        </div>
      </a>

      <a class="team-card" href="equipe-4.html">
        <img src="images/team/membre-4.jpg" alt="Portrait du membre 4">
        <div class="caption">
          <p class="name">Prénom Nom</p>
          <p class="role">Background &amp; concept art</p>
        </div>
      </a>

    </div>
  </main>

  <footer class="site-footer">
    <p>Dossier préparé pour une candidature en école d'animation 2D — 2026.</p>
  </footer>

</body>
</html>
